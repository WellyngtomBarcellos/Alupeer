name: alupeer

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    APP_ENV: ${APP_ENV:-production}

services:
  app:
    build: *app-build
    container_name: alupeer_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      socket:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-alupeer}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-alupeer}
      DB_USERNAME: ${DB_USERNAME:-alupeer}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      SOCKET_SERVER_SECRET: ${SOCKET_SERVER_SECRET:-}
      SOCKET_ALLOWED_ORIGIN: ${SOCKET_ALLOWED_ORIGIN:-http://localhost:8000}
      SOCKET_UPSTREAM: socket:3001
      SERVER_NAME: ${SERVER_NAME:-:80}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      IMG_BB_KEY: ${IMG_BB_KEY:-}
      MAP_BOX_TOKEN: ${MAP_BOX_TOKEN:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
      - "${APP_HTTPS_PORT:-443}:443/udp"
    volumes:
      - app_storage:/app/storage
      - app_bootstrap_cache:/app/bootstrap/cache
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - alupeer
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:80/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  socket:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: alupeer_socket
    restart: unless-stopped
    environment:
      PORT: "3001"
      SOCKET_SERVER_SECRET: ${SOCKET_SERVER_SECRET:-}
      SOCKET_ALLOWED_ORIGIN: ${SOCKET_ALLOWED_ORIGIN:-http://localhost:8000}
    # No host ports in base/prod — reached via app reverse proxy /socket.io/*
    networks:
      - alupeer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: alupeer_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alupeer}
      MYSQL_USER: ${DB_USERNAME:-alupeer}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alupeer
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  alupeer:
    driver: bridge

volumes:
  app_storage:
  app_bootstrap_cache:
  caddy_data:
  caddy_config:
  mysql_data:
